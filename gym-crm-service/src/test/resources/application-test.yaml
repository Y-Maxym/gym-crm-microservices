spring:
  application:
    name: gym-crm-app
  main:
    allow-bean-definition-overriding: true
  cloud:
    discovery:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    enabled: true
  jms:
    cache:
      enabled: false
    listener:
      auto-startup: false
  activemq:
    broker-url: vm://localhost?broker.persistent=false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  boot:
    admin:
      client:
        enabled: false

security:
  password:
    length: 10